<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuanClash · 配置页设计稿（堆叠轮播）</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F2F2F7;--surface:#FFFFFF;
  --primary:#6C5CE7;--primary-rgb:108,92,231;
  --success:#34C759;--success-rgb:52,199,89;
  --warning:#FF9500;--warning-rgb:255,149,0;
  --danger:#FF3B30;--danger-rgb:255,59,48;
  --blue:#007AFF;--blue-rgb:0,122,255;
  --text1:#1C1C1E;--text2:#6B6B70;--text3:#8E8E93;
  --border:rgba(0,0,0,0.06);
  --shadow:0 1px 3px rgba(0,0,0,0.05);
  --radius-card:16px;
}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text1);min-height:100vh;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
svg{display:block}

/* ── 应用外壳 ── */
.app{display:flex;min-height:100vh;padding:14px;gap:14px}
.sidebar{
  width:196px;flex-shrink:0;background:var(--surface);border:1px solid var(--border);
  border-radius:20px;box-shadow:var(--shadow);padding:14px 10px;
  display:flex;flex-direction:column;gap:2px;align-self:flex-start;position:sticky;top:14px;
}
.brand-row{display:flex;align-items:center;gap:9px;padding:2px 10px 14px}
.brand-icon{width:28px;height:28px;border-radius:8px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.brand-name{font-size:14px;font-weight:700;letter-spacing:-.2px}
.nav-sec{font-size:9.5px;font-weight:700;letter-spacing:1.1px;color:var(--text3);padding:12px 10px 4px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;font-size:12.5px;font-weight:500;color:var(--text2)}
.nav-item.active{background:rgba(var(--primary-rgb),.10);color:var(--primary);font-weight:600}
.nav-item svg{width:16px;height:16px;opacity:.75}
.nav-item.active svg{opacity:1}

.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}

/* ── 顶部工具条 ── */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 6px 0}
.toolbar-title{display:flex;align-items:baseline;gap:10px}
.toolbar-title h1{font-size:20px;font-weight:700;letter-spacing:-.4px}
.toolbar-title span{font-size:12px;color:var(--text3);font-family:'JetBrains Mono',monospace}
.toolbar-actions{display:flex;align-items:center;gap:4px}
.icon-btn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:.15s}
.icon-btn:hover{background:#fff;color:var(--text1);box-shadow:var(--shadow)}
.icon-btn svg{width:18px;height:18px}

/* ── 轮播舞台 ── */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;padding:4px 0 40px;gap:8px}
.carousel{position:relative;width:100%;max-width:1360px;height:700px;perspective:1800px;perspective-origin:50% 35%;touch-action:pan-y;user-select:none}

/* ── 配置卡片 ── */
.card{
  position:absolute;left:50%;top:80px;width:440px;height:300px;
  background:var(--surface);border:1px solid rgba(0,0,0,.055);
  border-radius:var(--radius-card);overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:0 30px 70px -30px rgba(35,31,60,.30),0 12px 26px -18px rgba(35,31,60,.14);
  transform:translateX(-50%);
  transition:transform .5s cubic-bezier(.22,.61,.36,1),opacity .4s ease,filter .4s ease,
             width .42s cubic-bezier(.22,.61,.36,1),height .42s cubic-bezier(.22,.61,.36,1),
             top .42s cubic-bezier(.22,.61,.36,1),box-shadow .4s ease;
  will-change:transform,width,height,top,opacity;cursor:pointer;
}
.card.main{z-index:30}
.card.main.expanded{z-index:40;cursor:default;width:800px;height:530px;top:50px;
  box-shadow:0 44px 90px -36px rgba(35,31,60,.34),0 16px 34px -20px rgba(35,31,60,.16)}
.card.side{z-index:20}
.card.far{z-index:10}
.card.ghost{z-index:1;pointer-events:none}
/* 远端卡片只保留一层边缘，避免文字堆叠 */
.card.far .card-name,.card.far .card-sub,.card.far .cover-body,
.card.far .cover-foot,.card.far .badges{opacity:0}

/* ── 封面（摘要） ── */
.card-cover{padding:20px 22px 0;height:300px;flex-shrink:0;display:flex;flex-direction:column;position:relative}
.cover-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px}
.badges{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:600;letter-spacing:.2px}
.badge-type{background:rgba(var(--primary-rgb),.10);color:var(--primary)}
.badge-file{background:rgba(var(--blue-rgb),.10);color:var(--blue)}
.badge-active{background:rgba(var(--success-rgb),.12);color:var(--success)}
.badge-active .dot{width:5px;height:5px;border-radius:50%;background:var(--success);box-shadow:0 0 0 2px rgba(var(--success-rgb),.18)}
.badge-muted{background:#F2F2F7;color:var(--text3)}
.cover-edit{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--text3);flex-shrink:0;transition:.15s}
.cover-edit:hover{background:rgba(var(--primary-rgb),.10);color:var(--primary)}
.cover-edit svg{width:15px;height:15px}
.card:not(.main) .cover-edit{display:none}
/* 右侧卡片镜像排布，让露出的外缘也能看到名称和流量 */
.card.right .card-cover{align-items:flex-end;text-align:right}
.card.right .cover-top{flex-direction:row-reverse}
.card.right .badges{justify-content:flex-end}
.card.right .card-sub{justify-content:flex-end}
.card.right .cover-body{flex-direction:row-reverse}
.card.right .remain-info{align-items:flex-end}
.card.right .file-summary{flex-direction:row-reverse;text-align:right}

.card-name{font-size:21px;font-weight:700;letter-spacing:-.4px;line-height:1.22;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-sub{font-size:11px;color:var(--text3);margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card-sub .sep{width:3px;height:3px;border-radius:50%;background:var(--text3);opacity:.5}

.cover-body{margin-top:auto;display:flex;align-items:center;gap:16px;padding-bottom:10px;min-height:0}
.remain-ring{position:relative;width:86px;height:86px;flex-shrink:0}
.remain-ring svg{width:86px;height:86px;transform:rotate(-90deg)}
.ring-track{fill:none;stroke:rgba(var(--primary-rgb),.10);stroke-width:7}
.ring-fill{fill:none;stroke:url(#ringGrad);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.ring-pct{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;letter-spacing:-.5px}
.ring-pct span{font-size:10px;font-weight:600;color:var(--text3);margin-left:1px}
.ring-lbl{font-size:8.5px;color:var(--text3);font-weight:500;letter-spacing:.3px}
.remain-info{min-width:0;display:flex;flex-direction:column;gap:3px}
.remain-title{font-size:11px;color:var(--text3);font-weight:500}
.remain-used{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;letter-spacing:-.2px}
.remain-used em{font-style:normal;color:var(--text3);font-weight:500}
.remain-note{font-size:10.5px;color:var(--text3);margin-top:2px}

.file-summary{display:flex;align-items:center;gap:12px;min-width:0}
.file-tile{width:52px;height:52px;border-radius:13px;background:rgba(var(--primary-rgb),.08);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.file-tile svg{width:24px;height:24px;color:var(--primary)}
.file-summary-main{min-width:0}
.file-summary-title{font-size:12px;font-weight:600}
.file-summary-meta{font-size:10.5px;color:var(--text3);margin-top:2px}

.cover-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--border);padding:9px 0 12px;font-size:10.5px;color:var(--text3)}
.cover-foot .expand-hint{display:flex;align-items:center;gap:5px;font-weight:500}
.cover-foot svg{width:13px;height:13px;transition:transform .3s ease}
.card.expanded .cover-foot svg{transform:rotate(180deg)}
.card:not(.main) .cover-foot{opacity:0}

/* ── 详情（展开后） ── */
.card-detail{max-height:0;opacity:0;overflow:hidden;transition:max-height .45s cubic-bezier(.22,.61,.36,1),opacity .28s ease;padding:0 22px}
.card.main.expanded .card-cover{height:250px}
.card.main.expanded .card-detail{max-height:280px;opacity:1;padding:0 22px 16px}
.detail-view{display:flex;flex-direction:column;gap:10px;padding-top:2px}
.card.editing .detail-view{display:none}
.edit-view{display:none;flex-direction:column;gap:9px;padding-top:2px}
.card.editing .edit-view{display:flex}

.detail-overview{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:12px;background:linear-gradient(135deg,rgba(var(--primary-rgb),.05),rgba(var(--primary-rgb),.015));border:1px solid rgba(var(--primary-rgb),.10)}
.detail-bar-wrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.detail-bar-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.detail-used{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700}
.detail-used em{font-style:normal;font-size:10.5px;color:var(--text3);font-weight:500}
.detail-pct{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--primary);font-weight:600}
.bar{height:6px;border-radius:3px;background:rgba(var(--primary-rgb),.10);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--primary),#9B8BFF)}
.detail-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;color:var(--text3)}
.detail-meta b{color:var(--text1);font-weight:600}
.detail-meta .mono{font-family:'JetBrains Mono',monospace}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:#F8F8FB;border:1px solid rgba(0,0,0,.035);min-width:0}
.stat-icon{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-icon svg{width:13px;height:13px}
.stat-text{min-width:0}
.stat-lbl{font-size:9px;color:var(--text3);font-weight:500}
.stat-val{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-val.mono{font-family:'JetBrains Mono',monospace}

.url-strip{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:10px;background:#F8F8FB;border:1px solid rgba(0,0,0,.035)}
.url-icon{width:26px;height:26px;border-radius:8px;background:rgba(var(--primary-rgb),.10);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.url-icon svg{width:13px;height:13px;color:var(--primary)}
.url-main{flex:1;min-width:0}
.url-lbl{font-size:9px;color:var(--text3);font-weight:500}
.url-val{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-btn{height:30px;padding:0 10px;border-radius:8px;background:#fff;border:1px solid rgba(0,0,0,.08);font-size:10.5px;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:4px;white-space:nowrap;flex-shrink:0}
.mini-btn:hover{border-color:rgba(var(--primary-rgb),.35);color:var(--primary)}
.mini-btn svg{width:12px;height:12px}

.detail-actions{display:flex;align-items:center;gap:7px;padding-top:8px;border-top:1px solid var(--border)}
.detail-actions .spacer{flex:1}
.btn{height:32px;padding:0 13px;border-radius:8px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:5px;transition:.15s}
.btn svg{width:13px;height:13px}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 3px 10px rgba(var(--primary-rgb),.28)}
.btn-primary:hover{background:#5B4BD5}
.btn-ghost{background:#F2F2F7;color:var(--text2)}
.btn-ghost:hover{background:#EAEAEF}
.btn-soft{background:rgba(var(--primary-rgb),.10);color:var(--primary)}
.btn-soft:hover{background:rgba(var(--primary-rgb),.16)}
.btn:disabled{opacity:.6;cursor:default;box-shadow:none}
.link-btn{font-size:10.5px;color:var(--text3);font-weight:500;display:flex;align-items:center;gap:4px}
.link-btn:hover{color:var(--primary)}
.link-btn.danger:hover{color:var(--danger)}
.link-btn svg{width:12px;height:12px}

/* ── 编辑表单 ── */
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:10px;font-weight:600;color:var(--text2)}
.field-row{display:flex;align-items:center;gap:7px}
.input{flex:1;min-width:0;height:31px;border-radius:8px;border:1px solid rgba(0,0,0,.08);background:#fff;padding:0 10px;font-size:11.5px;outline:none;transition:.15s}
.input:focus{border-color:rgba(var(--primary-rgb),.55);box-shadow:0 0 0 3px rgba(var(--primary-rgb),.10)}
.input.mono{font-family:'JetBrains Mono',monospace;font-size:10.5px}
.switch{width:34px;height:20px;border-radius:10px;background:#D1D1D6;position:relative;flex-shrink:0;transition:.2s;cursor:pointer}
.switch.on{background:var(--success)}
.switch::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;box-shadow:0 1px 3px rgba(0,0,0,.22);transition:.2s}
.switch.on::after{left:16px}
.select{height:31px;border-radius:8px;border:1px solid rgba(0,0,0,.08);background:#fff;padding:0 8px;font-size:11px;outline:none}
.edit-actions{display:flex;justify-content:flex-end;gap:7px;padding-top:2px}

/* ── 翻页控件 ── */
.pager{display:flex;align-items:center;gap:13px;margin-top:2px}
.pager-btn{width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid var(--border);box-shadow:0 6px 18px -10px rgba(35,31,60,.25);display:flex;align-items:center;justify-content:center;color:var(--text2);transition:.15s}
.pager-btn:hover{color:var(--primary);border-color:rgba(var(--primary-rgb),.30);transform:translateY(-1px)}
.pager-btn svg{width:17px;height:17px}
.dots{display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(0,0,0,.14);transition:.2s}
.dot.active{width:20px;border-radius:4px;background:var(--primary)}
.pager-count{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text3);letter-spacing:.5px;min-width:46px;text-align:center}

/* ── 书本标签 ── */
.bookmarks{display:flex;align-items:flex-end;gap:5px;flex-wrap:wrap;justify-content:center;max-width:900px;margin-top:2px}
.bookmark{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:9px;background:#fff;border:1px solid var(--border);font-size:11px;font-weight:500;color:var(--text2);box-shadow:0 1px 2px rgba(0,0,0,.03);transition:.15s;max-width:200px}
.bookmark:hover{border-color:rgba(var(--primary-rgb),.28);color:var(--primary)}
.bookmark.active{background:rgba(var(--primary-rgb),.10);border-color:rgba(var(--primary-rgb),.28);color:var(--primary);font-weight:600}
.bookmark .tab-dot{width:5px;height:5px;border-radius:50%;background:var(--success);flex-shrink:0}
.bookmark .tab-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── 提示 ── */
.hint{display:flex;align-items:center;gap:12px;font-size:10.5px;color:var(--text3);padding:4px 0;flex-wrap:wrap;justify-content:center}
.hint kbd{font-family:'JetBrains Mono',monospace;font-size:9.5px;background:#fff;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--text2)}
.hint .sep{width:3px;height:3px;border-radius:50%;background:var(--text3);opacity:.45}

/* ── FAB ── */
.fab{position:fixed;right:24px;bottom:24px;z-index:60;height:46px;padding:0 18px;border-radius:14px;background:var(--primary);color:#fff;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px;box-shadow:0 12px 30px -10px rgba(var(--primary-rgb),.55)}
.fab:hover{background:#5B4BD5}
.fab svg{width:16px;height:16px}

/* ── 响应式 ── */
@media(max-width:1200px){.sidebar{display:none}.card.main.expanded{width:720px}}
@media(max-width:820px){
  .app{padding:10px}
  .carousel{height:620px}
  .card{width:360px;height:280px;top:60px}
  .card.main.expanded{width:calc(100vw - 40px);height:600px;top:30px}
  .card-cover{height:280px;padding:18px 18px 0}
  .card-detail{padding:0 18px}
  .card.main.expanded .card-detail{padding:0 18px 14px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .detail-meta{gap:9px}
  .cover-body{gap:12px}
  .remain-ring{width:72px;height:72px}
  .remain-ring svg{width:72px;height:72px}
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand-row"><div class="brand-icon">Q</div><span class="brand-name">QuanClash</span></div>
    <div class="nav-sec">主要</div>
    <div class="nav-item"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="14" height="14" rx="4"/><path d="M10 6v4l2.5 2"/></svg>仪表盘</div>
    <div class="nav-item"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="10" r="2.5"/><circle cx="15" cy="5" r="2.5"/><circle cx="15" cy="15" r="2.5"/><line x1="7.5" y1="9" x2="12.5" y2="6"/><line x1="7.5" y1="11" x2="12.5" y2="14"/></svg>代理</div>
    <div class="nav-item active"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="14" height="14" rx="3"/><line x1="7" y1="7" x2="13" y2="7"/><line x1="7" y1="10" x2="13" y2="10"/><line x1="7" y1="13" x2="10" y2="13"/></svg>配置</div>
    <div class="nav-sec">监控</div>
    <div class="nav-item"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10C4 6.7 6.7 4 10 4s6 2.7 6 6"/><line x1="10" y1="10" x2="10" y2="16"/></svg>请求</div>
    <div class="nav-item"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="14" height="12" rx="2"/><line x1="3" y1="8" x2="17" y2="8"/><line x1="7" y1="8" x2="7" y2="16"/></svg>连接</div>
    <div class="nav-sec">系统</div>
    <div class="nav-item"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="3" y1="6" x2="17" y2="6"/><line x1="3" y1="10" x2="17" y2="10"/><line x1="3" y1="14" x2="13" y2="14"/></svg>工具</div>
  </aside>

  <main class="main">
    <div class="toolbar">
      <div class="toolbar-title"><h1>配置</h1><span id="count">6 个配置</span></div>
      <div class="toolbar-actions">
        <button class="icon-btn" title="更新全部"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M16 10a6 6 0 1 1-1.8-4.3"/><polyline points="16,3 16,7 12,7"/></svg></button>
        <button class="icon-btn" title="排序"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 3v14M6 17l-2.5-2.5M6 17l2.5-2.5"/><path d="M14 17V3M14 3l-2.5 2.5M14 3l2.5 2.5"/></svg></button>
        <button class="icon-btn" id="addTop" title="添加配置"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><line x1="10" y1="4" x2="10" y2="16"/><line x1="4" y1="10" x2="16" y2="10"/></svg></button>
      </div>
    </div>

    <div class="stage">
      <div class="carousel" id="carousel"></div>
      <div class="pager">
        <button class="pager-btn" id="prevBtn" title="上一个"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="12,4 6,10 12,16"/></svg></button>
        <div class="dots" id="dots"></div>
        <div class="pager-count" id="pagerCount">01 / 06</div>
        <button class="pager-btn" id="nextBtn" title="下一个"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="8,4 14,10 8,16"/></svg></button>
      </div>
      <div class="bookmarks" id="bookmarks"></div>
      <div class="hint">
        <span>点击主卡片展开详情</span><span class="sep"></span>
        <span><kbd>←</kbd> <kbd>→</kbd> 切换</span><span class="sep"></span>
        <span>拖动 / 点击两侧卡片翻页</span>
      </div>
    </div>
  </main>
</div>

<button class="fab" id="fab"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><line x1="10" y1="4" x2="10" y2="16"/><line x1="4" y1="10" x2="16" y2="10"/></svg>添加配置</button>

<svg width="0" height="0" style="position:absolute">
  <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6C5CE7"/><stop offset="100%" stop-color="#9B8BFF"/></linearGradient></defs>
</svg>

<script>
const profiles = [
  { label: 'ClashMeta_1792546863.yaml', type: 'url', active: true,
    url: 'https://sub.example.com/api/v1/client/subscribe?token=8f3c…',
    used: '219.4 GB', total: '2 TB', percent: 10.7,
    expire: '2027-07-05', days: 608, updated: '刚刚',
    autoUpdate: true, interval: '24 小时', nodes: 60, group: '国外流量', node: '日本A3' },
  { label: 'linuxdo', type: 'file', active: false,
    updated: '刚刚', autoUpdate: false, interval: '不自动更新',
    nodes: 18, group: '自动选择', node: '香港A1' },
  { label: '备用订阅', type: 'url', active: false,
    url: 'https://backup.example.com/subscribe?token=1a2b…',
    used: '12.6 GB', total: '500 GB', percent: 2.5,
    expire: '2026-12-31', days: 56, updated: '2 小时前',
    autoUpdate: true, interval: '12 小时', nodes: 32, group: '自动选择', node: '香港A1' },
  { label: '日本专线', type: 'url', active: false,
    url: 'https://jp.example.com/api/v1/client/subscribe?token=7d9e…',
    used: '88.2 GB', total: '1 TB', percent: 8.8,
    expire: '2027-03-15', days: 130, updated: '昨天',
    autoUpdate: true, interval: '24 小时', nodes: 24, group: '日本线路', node: '日本A1' },
  { label: '游戏加速', type: 'url', active: false,
    url: 'https://game.example.com/subscribe?token=5c1f…',
    used: '42.0 GB', total: '300 GB', percent: 14.0,
    expire: '2026-12-01', days: 26, updated: '3 小时前',
    autoUpdate: true, interval: '6 小时', nodes: 12, group: '游戏专线', node: '香港A2' },
  { label: '家庭宽带', type: 'file', active: false,
    updated: '3 天前', autoUpdate: false, interval: '不自动更新',
    nodes: 24, group: '自动选择', node: '台湾A1' },
];

const N = profiles.length;
const wrap = N >= 3;
let current = Math.max(0, profiles.findIndex(p => p.active));
let expanded = false;
let editing = false;

const carousel = document.getElementById('carousel');
const dotsEl = document.getElementById('dots');
const bookmarksEl = document.getElementById('bookmarks');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const pagerCount = document.getElementById('pagerCount');
const countEl = document.getElementById('count');

const pad = (n) => String(n).padStart(2, '0');
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const icon = (paths, color) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="color:${color}">${paths}</svg>`;

function ring(percent, size) {
  const r = size / 2 - 7;
  const c = 2 * Math.PI * r;
  const remaining = Math.max(0, Math.min(100, 100 - percent));
  const offset = c - c * remaining / 100;
  return `<svg viewBox="0 0 ${size} ${size}">
    <circle class="ring-track" cx="${size/2}" cy="${size/2}" r="${r}"/>
    <circle class="ring-fill" cx="${size/2}" cy="${size/2}" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"/>
  </svg>`;
}

function cover(p) {
  const badges = `
    <span class="badge ${p.type === 'url' ? 'badge-type' : 'badge-file'}">${p.type === 'url' ? '订阅' : '本地文件'}</span>
    ${p.active ? '<span class="badge badge-active"><i class="dot"></i>使用中</span>' : '<span class="badge badge-muted">未使用</span>'}`;
  const body = p.type === 'url' ? `
    <div class="remain-ring">
      ${ring(p.percent, 86)}
      <div class="ring-center">
        <div class="ring-pct">${(100 - p.percent).toFixed(1)}<span>%</span></div>
        <div class="ring-lbl">剩余流量</div>
      </div>
    </div>
    <div class="remain-info">
      <div class="remain-title">已用 ${p.percent}%</div>
      <div class="remain-used">${p.used} <em>/ ${p.total}</em></div>
      <div class="remain-note">到期 ${p.expire} · 剩 ${p.days} 天</div>
    </div>` : `
    <div class="file-summary">
      <div class="file-tile">${icon('<path d="M6 3h7l5 5v13H6z"/><polyline points="13,3 13,8 18,8"/>', 'currentColor')}</div>
      <div class="file-summary-main">
        <div class="file-summary-title">本地 YAML 配置</div>
        <div class="file-summary-meta">${p.nodes} 个节点 · 最后更新 ${p.updated}</div>
      </div>
    </div>`;
  return `
    <div class="card-cover">
      <div class="cover-top">
        <div class="badges">${badges}</div>
        <button class="cover-edit" title="编辑配置">${icon('<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/>', 'currentColor')}</button>
      </div>
      <div class="card-name">${esc(p.label)}</div>
      <div class="card-sub">
        <span>最后更新 ${p.updated}</span><span class="sep"></span>
        <span>${p.type === 'url' ? '远程订阅' : '本地文件'}</span><span class="sep"></span>
        <span>${p.nodes} 个节点</span>
      </div>
      <div class="cover-body">${body}</div>
      <div class="cover-foot">
        <span class="expand-hint">点击展开详情</span>
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="5,8 10,13 15,8"/></svg>
      </div>
    </div>`;
}

function detail(p) {
  const overview = p.type === 'url' ? `
    <div class="detail-overview">
      <div class="detail-bar-wrap">
        <div class="detail-bar-top">
          <div class="detail-used">${p.used} <em>/ ${p.total}</em></div>
          <div class="detail-pct">已用 ${p.percent}%</div>
        </div>
        <div class="bar"><i style="width:${p.percent}%"></i></div>
        <div class="detail-meta">
          <span>到期 <b class="mono">${p.expire}</b></span>
          <span>剩余 <b class="mono">${p.days} 天</b></span>
          <span>最后更新 <b>${p.updated}</b></span>
        </div>
      </div>
    </div>` : `
    <div class="url-strip">
      <div class="url-icon">${icon('<path d="M6 3h7l5 5v13H6z"/><polyline points="13,3 13,8 18,8"/>', 'currentColor')}</div>
      <div class="url-main"><div class="url-lbl">本地文件</div><div class="url-val">${esc(p.label)}</div></div>
      <button class="mini-btn">替换文件</button>
    </div>`;
  const stats = `
    <div class="stats">
      <div class="stat"><div class="stat-icon" style="background:rgba(var(--primary-rgb),.10)">${icon('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>', 'var(--primary)')}</div><div class="stat-text"><div class="stat-lbl">节点数量</div><div class="stat-val mono">${p.nodes}</div></div></div>
      <div class="stat"><div class="stat-icon" style="background:rgba(var(--success-rgb),.10)">${icon('<path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/>', 'var(--success)')}</div><div class="stat-text"><div class="stat-lbl">当前节点</div><div class="stat-val">${p.node}</div></div></div>
      <div class="stat"><div class="stat-icon" style="background:rgba(var(--blue-rgb),.10)">${icon('<path d="M4 6h16M4 12h16M4 18h10"/>', 'var(--blue)')}</div><div class="stat-text"><div class="stat-lbl">策略组</div><div class="stat-val">${p.group}</div></div></div>
      <div class="stat"><div class="stat-icon" style="background:rgba(var(--warning-rgb),.10)">${icon('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', 'var(--warning)')}</div><div class="stat-text"><div class="stat-lbl">自动更新</div><div class="stat-val">${p.autoUpdate ? '每 ' + p.interval : '关闭'}</div></div></div>
    </div>`;
  const url = p.type === 'url' ? `
    <div class="url-strip">
      <div class="url-icon">${icon('<path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/>', 'currentColor')}</div>
      <div class="url-main"><div class="url-lbl">订阅地址</div><div class="url-val">${esc(p.url)}</div></div>
      <button class="mini-btn">复制</button>
    </div>` : '';
  return `
    <div class="card-detail">
      <div class="detail-view">
        ${overview}${stats}${url}
        <div class="detail-actions">
          ${p.active
            ? `<button class="btn btn-soft" disabled>${icon('<polyline points="4,12 9,17 20,6"/>', 'currentColor')}当前配置</button>`
            : `<button class="btn btn-primary" data-use="1">${icon('<polyline points="4,12 9,17 20,6"/>', 'currentColor')}设为当前</button>`}
          ${p.type === 'url'
            ? `<button class="btn btn-ghost" data-update="1">${icon('<path d="M16 10a6 6 0 1 1-1.8-4.3"/><polyline points="16,3 16,7 12,7"/>', 'currentColor')}立即更新</button>`
            : `<button class="btn btn-ghost">${icon('<path d="M6 3h7l5 5v13H6z"/><polyline points="13,3 13,8 18,8"/>', 'currentColor')}替换文件</button>`}
          <div class="spacer"></div>
          <button class="link-btn">${icon('<path d="M9 3h6l1 4h4v14H4V7h4z"/>', 'currentColor')}高级覆盖</button>
          <button class="link-btn danger">${icon('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>', 'currentColor')}删除</button>
        </div>
      </div>
      <div class="edit-view">
        <div class="field"><label>配置名称</label><div class="field-row"><input class="input edit-name" value="${esc(p.label)}"></div></div>
        <div class="field">
          <label>${p.type === 'url' ? '订阅地址' : '本地文件'}</label>
          <div class="field-row">
            <input class="input ${p.type === 'url' ? 'mono' : ''}" value="${esc(p.type === 'url' ? p.url : p.label)}" ${p.type === 'file' ? 'readonly' : ''}>
            <button class="mini-btn">${p.type === 'url' ? '复制' : '替换文件'}</button>
          </div>
        </div>
        <div class="field">
          <label>自动更新</label>
          <div class="field-row">
            <div class="switch ${p.autoUpdate ? 'on' : ''}"></div>
            <select class="select">
              <option ${p.interval === '6 小时' ? 'selected' : ''}>6 小时</option>
              <option ${p.interval === '12 小时' ? 'selected' : ''}>12 小时</option>
              <option ${p.interval === '24 小时' ? 'selected' : ''}>24 小时</option>
              <option>手动更新</option>
            </select>
            <span style="font-size:10px;color:var(--text3)">仅在应用运行时检查</span>
          </div>
        </div>
        <div class="edit-actions">
          <button class="btn btn-ghost" data-cancel="1">取消</button>
          <button class="btn btn-primary" data-save="1">${icon('<polyline points="4,12 9,17 20,6"/>', 'currentColor')}保存修改</button>
        </div>
      </div>
    </div>`;
}

function build() {
  carousel.innerHTML = profiles.map((p, i) => `<article class="card" data-i="${i}">${cover(p)}${detail(p)}</article>`).join('');
  bindCards();
  layout(false);
  renderChrome();
}

function bindCards() {
  carousel.querySelectorAll('.card').forEach(card => {
    const i = +card.dataset.i;
    card.addEventListener('click', (e) => {
      if (e.target.closest('button, input, select, .edit-view')) return;
      if (i === current) toggleExpand();
      else goTo(i);
    });
    const editBtn = card.querySelector('.cover-edit');
    if (editBtn) editBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (i !== current) goTo(i);
      if (!expanded) expanded = true;
      editing = !editing;
      applyState();
    });
    const use = card.querySelector('[data-use]');
    if (use) use.addEventListener('click', (e) => {
      e.stopPropagation();
      profiles.forEach((p, idx) => p.active = idx === i);
      refreshBadges();
    });
    const upd = card.querySelector('[data-update]');
    if (upd) upd.addEventListener('click', (e) => {
      e.stopPropagation();
      profiles[i].updated = '刚刚';
      build();
      expanded = true;
      applyState();
    });
    const save = card.querySelector('[data-save]');
    if (save) save.addEventListener('click', (e) => {
      e.stopPropagation();
      const input = card.querySelector('.edit-name');
      if (input && input.value.trim()) profiles[i].label = input.value.trim();
      editing = false;
      build();
      expanded = true;
      applyState();
    });
    const cancel = card.querySelector('[data-cancel]');
    if (cancel) cancel.addEventListener('click', (e) => {
      e.stopPropagation();
      editing = false;
      applyState();
    });
    const sw = card.querySelector('.edit-view .switch');
    if (sw) sw.addEventListener('click', (e) => {
      e.stopPropagation();
      sw.classList.toggle('on');
    });
  });
}

function refreshBadges() {
  carousel.querySelectorAll('.card').forEach(card => {
    const p = profiles[+card.dataset.i];
    const badges = card.querySelector('.badges');
    if (!badges) return;
    badges.innerHTML = `
      <span class="badge ${p.type === 'url' ? 'badge-type' : 'badge-file'}">${p.type === 'url' ? '订阅' : '本地文件'}</span>
      ${p.active ? '<span class="badge badge-active"><i class="dot"></i>使用中</span>' : '<span class="badge badge-muted">未使用</span>'}`;
  });
}

function circular(i) {
  let d = i - current;
  if (!wrap) return d;
  if (d > N / 2) d -= N;
  if (d < -N / 2) d += N;
  return d;
}

function layout(animate = true) {
  carousel.classList.toggle('expanded', expanded);
  if (!animate) {
    carousel.querySelectorAll('.card').forEach(c => { c.style.transition = 'none'; });
  }
  const spread = expanded ? 1.45 : 1;
  carousel.querySelectorAll('.card').forEach(card => {
    const i = +card.dataset.i;
    const d = circular(i);
    const prev = card.dataset.d === undefined ? d : parseFloat(card.dataset.d);
    const jump = Math.abs(d - prev) > N / 2;
    const isMain = d === 0;
    const abs = Math.abs(d);

    card.classList.toggle('main', isMain);
    card.classList.toggle('expanded', isMain && expanded);
    card.classList.toggle('side', abs === 1);
    card.classList.toggle('far', abs === 2);
    card.classList.toggle('ghost', abs > 2);
    card.classList.toggle('right', d > 0);
    if (isMain) card.classList.toggle('editing', editing);
    else card.classList.remove('editing');

    const baseX = Math.min(340, Math.max(210, window.innerWidth * 0.215));
    const farX = baseX * 1.7;
    let x = 0, scale = 1, opacity = 1, blur = 0;
    if (abs === 1) { x = baseX; scale = .84; opacity = .55; blur = 1.1; }
    else if (abs === 2) { x = farX; scale = .74; opacity = .12; blur = 2.4; }
    else if (abs > 2) { x = farX * 1.4; scale = .7; opacity = 0; blur = 2.5; }
    if (expanded && !isMain) { x *= spread; opacity *= .22; blur += .6; }

    const transform = `translateX(-50%) translateX(${d < 0 ? -x : x}px) scale(${scale})`;
    if (jump && animate) {
      card.style.transition = 'none';
      card.style.transform = transform;
      card.style.opacity = opacity;
      card.style.filter = blur ? `blur(${blur}px)` : 'none';
      void card.offsetWidth;
      card.style.transition = '';
    } else {
      card.style.transform = transform;
      card.style.opacity = opacity;
      card.style.filter = blur ? `blur(${blur}px)` : 'none';
    }
    card.style.zIndex = isMain ? 40 : abs === 1 ? 20 : abs === 2 ? 10 : 1;
    card.style.pointerEvents = abs > 2 ? 'none' : 'auto';
    card.dataset.d = d;
  });
  const hint = carousel.querySelector('.card.main .expand-hint');
  if (hint) hint.textContent = expanded ? '收起详情' : '点击展开详情';
  if (!animate) {
    requestAnimationFrame(() => {
      carousel.querySelectorAll('.card').forEach(c => { c.style.transition = ''; });
    });
  }
}

function applyState() { layout(true); }

function toggleExpand() {
  expanded = !expanded;
  if (!expanded) editing = false;
  layout(true);
}

function goTo(index) {
  let target = wrap ? (index + N) % N : Math.max(0, Math.min(N - 1, index));
  if (target === current) return;
  current = target;
  expanded = false;
  editing = false;
  layout(true);
  renderChrome();
}

function renderChrome() {
  pagerCount.textContent = `${pad(current + 1)} / ${pad(N)}`;
  countEl.textContent = `${N} 个配置`;
  dotsEl.innerHTML = profiles.map((_, i) => `<button class="dot ${i === current ? 'active' : ''}" data-i="${i}"></button>`).join('');
  dotsEl.querySelectorAll('.dot').forEach(d => d.addEventListener('click', () => goTo(+d.dataset.i)));
  bookmarksEl.innerHTML = profiles.map((p, i) => `
    <button class="bookmark ${i === current ? 'active' : ''}" data-i="${i}">
      ${p.active ? '<span class="tab-dot"></span>' : ''}<span class="tab-name">${esc(p.label)}</span>
    </button>`).join('');
  bookmarksEl.querySelectorAll('.bookmark').forEach(b => b.addEventListener('click', () => goTo(+b.dataset.i)));
}

prevBtn.addEventListener('click', () => goTo(current - 1));
nextBtn.addEventListener('click', () => goTo(current + 1));

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') goTo(current - 1);
  if (e.key === 'ArrowRight') goTo(current + 1);
  if (e.key === 'Escape' && expanded) toggleExpand();
});

let dragStart = null;
carousel.addEventListener('pointerdown', (e) => {
  if (expanded) return;
  if (e.target.closest('button, input, select')) return;
  dragStart = e.clientX;
  carousel.setPointerCapture(e.pointerId);
});
carousel.addEventListener('pointerup', (e) => {
  if (dragStart == null) return;
  const dx = e.clientX - dragStart;
  dragStart = null;
  if (dx < -60) goTo(current + 1);
  if (dx > 60) goTo(current - 1);
});

function addProfile() {
  profiles.push({
    label: '新配置', type: 'url', active: false,
    url: 'https://example.com/subscribe', used: '0 GB', total: '—',
    percent: 0, expire: '—', days: 0, updated: '刚刚',
    autoUpdate: false, interval: '手动更新', nodes: 0, group: '—', node: '—',
  });
  build();
  goTo(profiles.length - 1);
}
document.getElementById('fab').addEventListener('click', addProfile);
document.getElementById('addTop').addEventListener('click', addProfile);

build();
</script>
</body>
</html>
