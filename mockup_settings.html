<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuanClash · 设置页设计稿</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F9FAFB;
  --surface:#FFFFFF;
  --primary:#7B61FF;--primary-rgb:123,97,255;
  --primary-soft:#F5F3FF;
  --success:#34C759;--success-rgb:52,199,89;
  --warning:#FF9500;--warning-rgb:255,149,0;
  --danger:#FF3B30;--danger-rgb:255,59,48;
  --blue:#007AFF;--blue-rgb:0,122,255;
  --text1:#1C1C1E;--text2:#6B6B70;--text3:#8E8E93;--text4:#A0A0A8;
  --border:#F1F1F5;--border-strong:#EAEAF0;
  --field:#F3F4F6;
  --shadow-card:0 30px 70px -34px rgba(35,31,60,.20),0 10px 24px -16px rgba(35,31,60,.08);
  --shadow-modal:0 40px 100px -30px rgba(35,31,60,.30),0 14px 30px -18px rgba(35,31,60,.14);
}
html,body{height:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:var(--text1);
  background:
    radial-gradient(1100px 520px at 50% -10%, #F2EEFF 0%, rgba(242,238,255,0) 60%),
    var(--bg);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
svg{display:block}

/* ── 应用外壳 ── */
.app{display:flex;height:100vh;padding:14px;gap:14px}
.sidebar{
  width:200px;flex-shrink:0;background:var(--surface);border:1px solid rgba(0,0,0,.05);
  border-radius:20px;box-shadow:0 10px 30px -24px rgba(35,31,60,.18);
  padding:14px 10px;display:flex;flex-direction:column;gap:2px;align-self:flex-start;
}
.brand-row{display:flex;align-items:center;gap:9px;padding:2px 10px 14px}
.brand-icon{width:28px;height:28px;border-radius:8px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.brand-name{font-size:14px;font-weight:700;letter-spacing:-.2px}
.nav-sec{font-size:9.5px;font-weight:700;letter-spacing:1.1px;color:var(--text4);padding:12px 10px 4px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;font-size:12.5px;font-weight:500;color:var(--text2);cursor:pointer;transition:.15s}
.nav-item:hover{background:#F7F7FA}
.nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav-item svg{width:16px;height:16px;opacity:.8}
.nav-item.active svg{opacity:1}

/* ── 页面 ── */
.content{flex:1;min-width:0;overflow-y:auto;display:flex;justify-content:center;padding:26px 24px 40px}
.page{width:100%;max-width:800px}
.page-head{margin-bottom:16px;padding-left:4px}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;letter-spacing:2.2px;color:var(--primary);opacity:.75;text-transform:uppercase;margin-bottom:6px}
.page-head h1{font-size:24px;font-weight:700;letter-spacing:-.5px}
.page-head p{font-size:12px;color:var(--text3);margin-top:4px}

/* ── 设置卡片 ── */
.settings-card{
  position:relative;width:100%;height:680px;background:var(--surface);
  border:1px solid rgba(0,0,0,.045);border-radius:20px;box-shadow:var(--shadow-card);
  overflow:hidden;
}
.card-main,.card-sub{
  position:absolute;inset:0;display:flex;flex-direction:column;
  transition:transform .28s cubic-bezier(.22,.61,.36,1),opacity .22s ease;
  background:var(--surface);
}
.card-sub{transform:translateX(28px);opacity:0;pointer-events:none}
.settings-card.sub-open .card-main{transform:translateX(-28px);opacity:0;pointer-events:none}
.settings-card.sub-open .card-sub{transform:translateX(0);opacity:1;pointer-events:auto}

/* ── 胶囊 Tabs ── */
.tabs-wrap{padding:20px 24px 10px;flex-shrink:0}
.tabs{position:relative;display:flex;gap:2px;background:#F7F7FA;border-radius:12px;padding:4px}
.tab-indicator{
  position:absolute;top:4px;bottom:4px;left:4px;width:0;background:var(--primary-soft);
  border-radius:9px;transition:left .26s cubic-bezier(.22,.61,.36,1),width .26s cubic-bezier(.22,.61,.36,1);
  z-index:0;
}
.tab{
  position:relative;z-index:1;flex:1;height:34px;border-radius:9px;font-size:12.5px;font-weight:600;
  color:var(--text3);transition:color .18s;white-space:nowrap;
}
.tab:hover{color:var(--text1)}
.tab.active{color:var(--primary)}

/* ── 列表 ── */
.tab-content,.sub-content{flex:1;overflow-y:auto;padding:4px 0 20px}
.tab-content::-webkit-scrollbar,.sub-content::-webkit-scrollbar{width:8px}
.tab-content::-webkit-scrollbar-thumb,.sub-content::-webkit-scrollbar-thumb{background:rgba(0,0,0,.10);border-radius:8px;border:2px solid transparent;background-clip:content-box}
.section-label{font-size:10.5px;font-weight:700;letter-spacing:.9px;color:var(--text4);text-transform:uppercase;padding:18px 24px 6px}
.row{
  display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 24px;
  border-bottom:1px solid var(--border);transition:background .15s;cursor:default;
}
.row.clickable{cursor:pointer}
.row:hover{background:#FAFAFC}
.row:last-child{border-bottom:0}
.icon-tile{
  width:32px;height:32px;border-radius:9px;background:var(--primary-soft);color:var(--primary);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.icon-tile svg{width:16px;height:16px}
.row-main{flex:1;min-width:0}
.row-title{font-size:13.5px;font-weight:600;letter-spacing:-.1px}
.row-sub{font-size:11px;color:var(--text3);margin-top:2px;line-height:1.35}
.row-value{font-size:12px;color:var(--text3);white-space:nowrap}
.mono-value{font-family:'JetBrains Mono',monospace}
.row-trailing{display:flex;align-items:center;gap:8px;flex-shrink:0}
.chevron{width:16px;height:16px;color:#C7C7CC;flex-shrink:0}

/* ── 控件 ── */
.switch{width:44px;height:26px;border-radius:13px;background:#E5E5EA;position:relative;flex-shrink:0;transition:background .2s;cursor:pointer}
.switch::after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:2px;left:2px;box-shadow:0 2px 5px rgba(0,0,0,.18);transition:left .2s}
.switch.on{background:var(--primary)}
.switch.on::after{left:20px}

.select-wrap{position:relative}
.select{
  height:34px;min-width:124px;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:0 10px;background:var(--field);border:1px solid var(--border-strong);border-radius:8px;
  font-size:12px;font-weight:500;color:var(--text1);transition:.15s;
}
.select:hover{border-color:#DCD4FF}
.select svg{width:12px;height:12px;color:var(--text3)}
.select-menu{
  position:absolute;right:0;top:40px;min-width:160px;background:#fff;border:1px solid var(--border);
  border-radius:10px;box-shadow:0 18px 40px -18px rgba(35,31,60,.28);padding:5px;z-index:30;
  opacity:0;transform:translateY(-4px);pointer-events:none;transition:.15s;
}
.select-wrap.open .select-menu{opacity:1;transform:translateY(0);pointer-events:auto}
.select-option{display:flex;align-items:center;justify-content:space-between;height:34px;padding:0 10px;border-radius:7px;font-size:12px;color:var(--text2);cursor:pointer}
.select-option:hover{background:#FAFAFC}
.select-option.selected{background:var(--primary-soft);color:var(--primary);font-weight:600}
.select-option svg{width:13px;height:13px}

.ghost-btn{
  height:32px;padding:0 13px;border-radius:8px;border:1px solid #E4DCFF;color:var(--primary);
  background:transparent;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px;
  transition:.15s;white-space:nowrap;
}
.ghost-btn:hover{background:var(--primary-soft)}
.ghost-btn.soft{background:var(--primary-soft);border-color:transparent}
.ghost-btn.soft:hover{background:#EDE8FF}
.ghost-btn svg{width:13px;height:13px}

.key-chip{
  display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;
  background:var(--field);border:1px solid var(--border-strong);font-family:'JetBrains Mono',monospace;
  font-size:10px;color:var(--text2);
}

/* ── 次级页头 ── */
.sub-header{
  display:flex;align-items:center;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--border);flex-shrink:0;
}
.back-btn{
  width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--text2);transition:.15s;
}
.back-btn:hover{background:var(--primary-soft);color:var(--primary)}
.back-btn svg{width:17px;height:17px}
.sub-title{font-size:17px;font-weight:700;letter-spacing:-.3px}
.sub-sub{font-size:11px;color:var(--text3);margin-top:1px}

/* ── 模态 ── */
.modal-overlay{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:rgba(24,20,40,.10);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;visibility:hidden;transition:opacity .2s ease,visibility .2s;
}
.modal-overlay.open{opacity:1;visibility:visible}
.modal{
  width:420px;max-width:calc(100vw - 48px);background:#fff;border-radius:20px;box-shadow:var(--shadow-modal);
  padding:20px;transform:translateY(8px) scale(.98);transition:transform .22s cubic-bezier(.22,.61,.36,1);
  max-height:calc(100vh - 64px);display:flex;flex-direction:column;
}
.modal-overlay.open .modal{transform:translateY(0) scale(1)}
.modal.wide{width:460px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-shrink:0}
.modal-title{font-size:17px;font-weight:700;letter-spacing:-.3px}
.modal-sub{font-size:11px;color:var(--text3);margin-top:2px}
.modal-close{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text3);transition:.15s}
.modal-close:hover{background:#F5F5F8;color:var(--text1)}
.modal-close svg{width:16px;height:16px}
.modal-body{overflow-y:auto;margin:0 -4px;padding:0 4px}
.option-row{
  display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 14px;
  border-radius:12px;border:1px solid transparent;background:#fff;text-align:left;transition:.15s;margin-bottom:4px;
}
.option-row:hover{background:#FAFAFC}
.option-row.selected{background:var(--primary-soft)}
.option-name{font-size:13px;font-weight:600;color:var(--text1)}
.option-desc{font-size:10.5px;color:var(--text3);margin-top:1px}
.option-check{width:18px;height:18px;color:var(--primary);opacity:0;flex-shrink:0;margin-left:auto}
.option-row.selected .option-check{opacity:1}

.segmented{display:flex;gap:4px;background:#F7F7FA;border-radius:10px;padding:4px;margin-bottom:14px}
.segmented button{flex:1;height:32px;border-radius:8px;font-size:12px;font-weight:600;color:var(--text3);transition:.15s}
.segmented button.active{background:var(--primary-soft);color:var(--primary)}
.segmented button:hover{color:var(--text1)}
.segmented button.active:hover{color:var(--primary)}

.theme-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px;border-top:1px solid var(--border)}
.theme-row:first-of-type{border-top:0}
.theme-label{font-size:12.5px;font-weight:600}
.theme-desc{font-size:10.5px;color:var(--text3);margin-top:2px}
.swatches{display:flex;gap:10px;flex-wrap:wrap;padding:10px 2px 14px}
.swatch{width:26px;height:26px;border-radius:50%;position:relative;cursor:pointer;transition:.15s}
.swatch:hover{transform:scale(1.08)}
.swatch.selected::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--primary)}
.swatch svg{position:absolute;inset:0;margin:auto;width:12px;height:12px;color:#fff;opacity:0}
.swatch.selected svg{opacity:1}

.scale-row{padding:6px 2px 12px;border-top:1px solid var(--border)}
.scale-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.scale-value{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--primary);font-weight:600}
.slider{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:#F1F1F5;outline:none;margin:12px 0 4px}
.slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--primary);box-shadow:0 2px 6px rgba(123,97,255,.35);cursor:pointer}
.slider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--primary);box-shadow:0 2px 6px rgba(123,97,255,.35);cursor:pointer}
.scale-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--text4);font-family:'JetBrains Mono',monospace}

/* ── Toast ── */
.toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(12px);
  background:rgba(28,28,30,.92);color:#fff;font-size:12px;font-weight:500;
  padding:9px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:200;
  backdrop-filter:blur(10px);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:900px){
  .sidebar{display:none}
  .content{padding:16px}
  .settings-card{height:calc(100vh - 150px)}
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand-row">
      <div class="brand-icon">Q</div>
      <span class="brand-name">QuanClash</span>
    </div>
    <div class="nav-sec">主要</div>
    <div class="nav-item"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="14" height="14" rx="4"/><path d="M10 6v4l2.5 2"/></svg>仪表盘</div>
    <div class="nav-item"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="10" r="2.5"/><circle cx="15" cy="5" r="2.5"/><circle cx="15" cy="15" r="2.5"/><line x1="7.5" y1="9" x2="12.5" y2="6"/><line x1="7.5" y1="11" x2="12.5" y2="14"/></svg>代理</div>
    <div class="nav-item"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="14" height="14" rx="3"/><line x1="7" y1="7" x2="13" y2="7"/><line x1="7" y1="10" x2="13" y2="10"/><line x1="7" y1="13" x2="10" y2="13"/></svg>配置</div>
    <div class="nav-sec">监控</div>
    <div class="nav-item"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10C4 6.7 6.7 4 10 4s6 2.7 6 6"/><line x1="10" y1="10" x2="10" y2="16"/></svg>请求</div>
    <div class="nav-item"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="14" height="12" rx="2"/><line x1="3" y1="8" x2="17" y2="8"/><line x1="7" y1="8" x2="7" y2="16"/></svg>连接</div>
    <div class="nav-item"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="12" height="14" rx="2"/><line x1="7" y1="7" x2="13" y2="7"/><line x1="7" y1="10" x2="13" y2="10"/><line x1="7" y1="13" x2="10" y2="13"/></svg>日志</div>
    <div class="nav-sec">系统</div>
    <div class="nav-item"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="3" y1="6" x2="17" y2="6"/><line x1="3" y1="10" x2="17" y2="10"/><line x1="3" y1="14" x2="13" y2="14"/></svg>工具</div>
    <div class="nav-item active"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10" cy="10" r="3"/><path d="M10 3v2M10 15v2M3 10h2M15 10h2M5.1 5.1l1.4 1.4M13.5 13.5l1.4 1.4M5.1 14.9l1.4-1.4M13.5 6.5l1.4-1.4"/></svg>设置</div>
  </aside>

  <main class="content">
    <div class="page">
      <div class="page-head">
        <div class="eyebrow">QuanClash / Preferences</div>
        <h1>设置</h1>
        <p>外观、网络、内核与数据管理</p>
      </div>

      <div class="settings-card" id="settingsCard">
        <!-- 主视图 -->
        <div class="card-main" id="mainView">
          <div class="tabs-wrap">
            <div class="tabs" id="tabs">
              <span class="tab-indicator" id="tabIndicator"></span>
              <button class="tab active" data-tab="general">通用</button>
              <button class="tab" data-tab="network">网络</button>
              <button class="tab" data-tab="core">内核</button>
              <button class="tab" data-tab="about">关于</button>
            </div>
          </div>
          <div class="tab-content" id="tabContent"></div>
        </div>

        <!-- 次级页视图 -->
        <div class="card-sub" id="subView">
          <div class="sub-header">
            <button class="back-btn" id="backBtn" aria-label="返回">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9"><line x1="16" y1="10" x2="4" y2="10"/><polyline points="9,5 4,10 9,15"/></svg>
            </button>
            <div>
              <div class="sub-title" id="subTitle">基本配置</div>
              <div class="sub-sub" id="subSub">应用行为与启动选项</div>
            </div>
          </div>
          <div class="sub-content" id="subContent"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast">已保存</div>

<script>
/* ── 小图标 ── */
const icon = (paths, cls='') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${paths}</svg>`;
const icons = {
  palette: icon('<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18c1.5 0 2-1 1.4-2.2-.6-1.2 0-2.3 1.4-2.3H18a3 3 0 0 0 3-3c0-5-4-10-9-10z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/>'),
  globe: icon('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>'),
  sliders: icon('<line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2" fill="#fff"/><circle cx="15" cy="12" r="2" fill="#fff"/><circle cx="8" cy="17" r="2" fill="#fff"/>'),
  database: icon('<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>'),
  keyboard: icon('<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/>'),
  power: icon('<path d="M12 3v9"/><path d="M6.5 6.5a8 8 0 1 0 11 0"/>'),
  refresh: icon('<path d="M20 11a8 8 0 1 0-2.3 6"/><polyline points="20,4 20,11 13,11"/>'),
  router: icon('<rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 16h.01M11 16h.01"/><path d="M12 13V9M8 6a6 6 0 0 1 8 0M9.5 8a3.5 3.5 0 0 1 5 0"/>'),
  shield: icon('<path d="M12 3l7 3v6c0 4.4-3 7.7-7 9-4-1.3-7-4.6-7-9V6z"/>'),
  info: icon('<circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="8" r=".8" fill="currentColor"/>'),
  external: icon('<path d="M14 4h6v6"/><path d="M20 4l-8 8"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/>'),
  file: icon('<path d="M6 3h7l5 5v13H6z"/><polyline points="13,3 13,8 18,8"/>'),
  check: icon('<polyline points="5,12 10,17 19,7"/>'),
  chevronRight: icon('<polyline points="9,5 15,12 9,19"/>'),
  chevronDown: icon('<polyline points="6,9 12,15 18,9"/>'),
  x: icon('<line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>'),
  copy: icon('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>'),

/* ── 行与控件 ── */
function switchHtml(on){ return `<div class="switch ${on?'on':''}" data-switch></div>`; }
function selectHtml(id, value, options){
  return `<div class="select-wrap" data-select id="${id}">
    <button class="select" data-select-toggle><span data-select-value>${value}</span>${icons.chevronDown}</button>
    <div class="select-menu">
      ${options.map(o=>`<div class="select-option ${o===value?'selected':''}" data-option="${o}"><span>${o}</span>${icons.check}</div>`).join('')}
    </div>
  </div>`;
}
function row({iconName, title, sub, trailing, clickable=false, attrs='' }){
  return `<div class="row ${clickable?'clickable':''}" ${attrs}>
    <div class="icon-tile">${icons[iconName]||icons.sliders}</div>
    <div class="row-main"><div class="row-title">${title}</div>${sub?`<div class="row-sub">${sub}</div>`:''}</div>
    <div class="row-trailing">${trailing||''}</div>
  </div>`;
}
function subRow(iconName, title, sub, attrs=''){
  return row({iconName, title, sub, trailing: icons.chevronRight.replace('class="', 'class="chevron '), clickable:true, attrs});
}
function valueRow(iconName, title, value, sub, attrs=''){
  return row({iconName, title, sub, trailing:`<span class="row-value">${value}</span>${icons.chevronRight.replace('class="', 'class="chevron ') }`, clickable:true, attrs});
}

/* ── Tab 切换 ── */
const tabsEl = document.getElementById('tabs');
const indicator = document.getElementById('tabIndicator');
const tabContent = document.getElementById('tabContent');
let activeTab = 'general';

function moveIndicator(btn){
  indicator.style.left = btn.offsetLeft + 'px';
  indicator.style.width = btn.offsetWidth + 'px';
}
function renderTab(key, animate=true){
  activeTab = key;
  tabContent.innerHTML = tabs[key];
  tabContent.style.animation = 'none';
  if (animate) {
    tabContent.animate([{opacity:0, transform:'translateY(6px)'},{opacity:1, transform:'translateY(0)'}], {duration:180, easing:'ease-out'});
  }
  tabContent.scrollTop = 0;
}
tabsEl.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    tabsEl.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    moveIndicator(btn);
    renderTab(btn.dataset.tab);
  });
});
window.addEventListener('load', ()=>{
  const active = tabsEl.querySelector('.tab.active');
  moveIndicator(active);
  renderTab(active.dataset.tab, false);
});
window.addEventListener('resize', ()=>{
  const active = tabsEl.querySelector('.tab.active');
  if (active) moveIndicator(active);
});

/* ── 次级页 ── */
const card = document.getElementById('settingsCard');
const subTitle = document.getElementById('subTitle');
const subSub = document.getElementById('subSub');
const subContent = document.getElementById('subContent');
function openSub(key){
  const data = subs[key];
  if (!data) return;
  subTitle.textContent = data.title;
  subSub.textContent = data.sub;
  subContent.innerHTML = data.content;
  subContent.scrollTop = 0;
  card.classList.add('sub-open');
}
document.getElementById('backBtn').addEventListener('click', ()=>{
  card.classList.remove('sub-open');
});

/* ── 控件事件（事件委托） ── */
document.addEventListener('click', (e)=>{
  const sw = e.target.closest('[data-switch]');
  if (sw) { sw.classList.toggle('on'); return; }

  const toggle = e.target.closest('[data-select-toggle]');
  if (toggle) {
    const wrap = toggle.closest('.select-wrap');
    const wasOpen = wrap.classList.contains('open');
    document.querySelectorAll('.select-wrap.open').forEach(w=>w.classList.remove('open'));
    if (!wasOpen) wrap.classList.add('open');
    e.stopPropagation();
    return;
  }
  const option = e.target.closest('[data-option]');
  if (option) {
    const wrap = option.closest('.select-wrap');
    wrap.querySelector('[data-select-value]').textContent = option.dataset.option;
    wrap.querySelectorAll('.select-option').forEach(o=>o.classList.remove('selected'));
    option.classList.add('selected');
    wrap.classList.remove('open');
    toast('已切换为「' + option.dataset.option + '」');
    return;
  }
  if (!e.target.closest('.select-wrap')) {
    document.querySelectorAll('.select-wrap.open').forEach(w=>w.classList.remove('open'));
  }

  const sub = e.target.closest('[data-sub]');
  if (sub) { openSub(sub.dataset.sub); return; }

  const modalTrigger = e.target.closest('[data-modal]');
  if (modalTrigger) { openModal(modalTrigger.dataset.modal); return; }

  const toastBtn = e.target.closest('[data-toast]');
  if (toastBtn) { toast(toastBtn.dataset.toast); return; }
});

/* ── 模态 ── */
const overlay = document.getElementById('modalOverlay');
const modal = document.getElementById('modal');
const languages = [
  {name:'简体中文', desc:'Chinese (Simplified)'},
  {name:'English', desc:'English'},
  {name:'日本語', desc:'Japanese'},
  {name:'Русский', desc:'Russian'},
];
let currentLanguage = '简体中文';
let currentTheme = '浅色';

function openModal(kind){
  if (kind === 'language') {
    modal.className = 'modal';
    modal.innerHTML = `
      <div class="modal-head">
        <div><div class="modal-title">语言</div><div class="modal-sub">选择界面显示语言</div></div>
        <button class="modal-close" data-close>${icons.x}</button>
      </div>
      <div class="modal-body">
        ${languages.map(l=>`
          <button class="option-row ${l.name===currentLanguage?'selected':''}" data-lang="${l.name}">
            <div class="icon-tile">${icons.globe}</div>
            <div><div class="option-name">${l.name}</div><div class="option-desc">${l.desc}</div></div>
            <span class="option-check">${icons.check}</span>
          </button>`).join('')}
      </div>`;
  } else if (kind === 'theme') {
    modal.className = 'modal wide';
    modal.innerHTML = `
      <div class="modal-head">
        <div><div class="modal-title">主题</div><div class="modal-sub">外观、品牌色与文字大小</div></div>
        <button class="modal-close" data-close>${icons.x}</button>
      </div>
      <div class="modal-body">
        <div class="segmented" data-theme-mode>
          ${['跟随系统','浅色','深色'].map(t=>`<button class="${t===currentTheme?'active':''}" data-mode="${t}">${t}</button>`).join('')}
        </div>
        <div class="theme-row" style="border-top:0;padding-top:0">
          <div><div class="theme-label">品牌色</div><div class="theme-desc">用于激活状态、图标和滑块</div></div>
        </div>
        <div class="swatches" data-swatches>
          ${['#7B61FF','#007AFF','#34C759','#FF9500','#FF3B30','#1C1C1E'].map((c,i)=>`
            <div class="swatch ${i===0?'selected':''}" style="background:${c}" data-color="${c}">${icons.check}</div>`).join('')}
        </div>
        <div class="theme-row">
          <div><div class="theme-label">纯黑模式</div><div class="theme-desc">深色模式下使用纯黑背景</div></div>
          ${switchHtml(false)}
        </div>
        <div class="scale-row">
          <div class="scale-top">
            <div><div class="theme-label">文字大小</div><div class="theme-desc">调整全局文字缩放</div></div>
            <div class="scale-value" id="scaleValue">100%</div>
          </div>
          <input type="range" class="slider" id="scaleSlider" min="80" max="130" step="5" value="100">
          <div class="scale-labels"><span>小</span><span>大</span></div>
        </div>
      </div>`;
    const slider = modal.querySelector('#scaleSlider');
    const scaleValue = modal.querySelector('#scaleValue');
    const paint = () => {
      const p = (slider.value - slider.min) / (slider.max - slider.min) * 100;
      slider.style.background = `linear-gradient(90deg, var(--primary) ${p}%, #F1F1F5 ${p}%)`;
      scaleValue.textContent = slider.value + '%';
    };
    slider.addEventListener('input', paint);
    paint();
    modal.querySelectorAll('[data-mode]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        modal.querySelectorAll('[data-mode]').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        currentTheme = btn.dataset.mode;
        const row = document.querySelector('[data-modal="theme"] .row-value');
        if (row) row.textContent = currentTheme;
      });
    });
    modal.querySelectorAll('[data-color]').forEach(sw=>{
      sw.addEventListener('click', ()=>{
        modal.querySelectorAll('[data-color]').forEach(s=>s.classList.remove('selected'));
        sw.classList.add('selected');
      });
    });
  }
  overlay.classList.add('open');
  modal.querySelector('[data-close]').addEventListener('click', closeModal);
  modal.querySelectorAll('[data-lang]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentLanguage = btn.dataset.lang;
      const row = document.querySelector('[data-modal="language"]');
      if (row) row.querySelector('.row-value').textContent = currentLanguage;
      closeModal();
      toast('界面语言已切换为 ' + currentLanguage);
    });
  });
}
function closeModal(){ overlay.classList.remove('open'); }
overlay.addEventListener('click', (e)=>{ if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape') closeModal(); });

/* ── Toast ── */
let toastTimer;
function toast(text){
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 1600);
}
</script>
